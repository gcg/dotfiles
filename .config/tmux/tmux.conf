# terminal
set -g  default-terminal "tmux-256color"

# behaviour
set -g  mouse on
set -g  base-index 1
set -g  pane-base-index 1
set -g  renumber-windows on
set -g  status-justify centre
# allow-passthrough disabled to prevent escape sequence leaks from adjacent
# tmux panes (e.g., opencode's kitty-graphics queries leaking into Neovim).
# tmux 3.4+ handles passthrough safely; explicit 'on' re-enables the old
# leaky behaviour.
set -g  allow-passthrough off
set -s  extended-keys on
set -as terminal-features 'xterm*:extkeys'
setw -g mode-keys vi
setw -g automatic-rename on

# prefix
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# keys
bind-key -T copy-mode-vi WheelUpPane   select-pane \; send-keys -X -N 1 scroll-up
bind-key -T copy-mode-vi WheelDownPane select-pane \; send-keys -X -N 1 scroll-down
bind c   new-window     -c "#{pane_current_path}"
bind '"' split-window   -c "#{pane_current_path}"
bind %   split-window -h -c "#{pane_current_path}"
bind R   source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded."
# tpack TUI (prefix+T is taken by the ukiyo theme menu)
bind P   display-popup -E -w 80 -h 25 "tpack tui"

# ukiyo theme
set -g @ukiyo-plugins              "battery cpu-usage time"
set -g @ukiyo-show-powerline       false
set -g @ukiyo-show-flags           true
set -g @ukiyo-ignore-window-colors true
set -g @ukiyo-left-icon            session
set -g @ukiyo-military-time        true
set -g @ukiyo-show-timezone        false

set-hook -g client-dark-theme {
  set -g @ukiyo-theme "kanagawa/dragon"
  run ~/.config/tmux/plugins/tmux-ukiyo/ukiyo.tmux
  set -ag status-right "#(~/.config/tmux/plugins/tmux-continuum-ada87b6f887d/scripts/continuum_save.sh)"
}
set-hook -g client-light-theme {
  set -g @ukiyo-theme "kanagawa/lotus"
  run ~/.config/tmux/plugins/tmux-ukiyo/ukiyo.tmux
  set -ag status-right "#(~/.config/tmux/plugins/tmux-continuum-ada87b6f887d/scripts/continuum_save.sh)"
}

# resurrect / continuum
set -g @resurrect-processes     'false'
set -g @continuum-restore       'on'
set -g @continuum-save-interval '5'

# plugins
set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.config/tmux/plugins/"

set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-open'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'wfxr/tmux-fzf-url'
set -g @plugin 'Nybkox/tmux-ukiyo'
# tmux-continuum must stay last: it appends its autosave hook to status-right,
# and a theme sourced after it would wipe that. The client-*-theme hooks above
# re-add the hook too, since they re-run ukiyo long after plugins have loaded.
set -g @plugin 'tmux-plugins/tmux-continuum'

run 'tpack init'

# after plugins: tmux-sensible unconditionally sets status-keys emacs
set -g status-keys vi
