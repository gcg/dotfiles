prSections:
- title: Needs My Review
  filters: is:open review-requested:@me
- title: My Pull Requests
  filters: is:open author:@me
- title: Involved
  filters: is:open involves:@me -author:@me
issuesSections:
- title: My Issues
  filters: is:open author:@me
- title: Poltio Issues
  filters: is:open repo:poltio/issues
- title: Assigned
  filters: is:open assignee:@me
- title: Involved
  filters: is:open involves:@me -author:@me
defaults:
  preview:
    open: true
    width: 50
  prsLimit: 100
  issuesLimit: 100
  notificationsLimit: 100
  view: notifications
  layout:
    prs:
      updatedAt:
        width: 7
      repo:
        width: 15
      author:
        width: 15
      assignees:
        width: 20
        hidden: true
      base:
        width: 15
        hidden: true
      lines:
        width: 16
    issues:
      updatedAt:
        width: 7
      repo:
        width: 15
      creator:
        width: 10
      assignees:
        width: 20
        hidden: true
  refetchIntervalMinutes: 30
keybindings:
  issues: []
  prs: []
repoPaths: {}
includeReadNotifications: false
theme:
  ui:
    table:
      showSeparator: true
  # ANSI indices, so colors follow ghostty's Kanagawa Lotus/Dragon palette.
  # text.primary, text.inverted and background.selected stay on gh-dash's
  # adaptive light/dark defaults: no single ANSI slot reads well in both.
  colors:
    text:
      secondary: "4"
      faint: "8"
      warning: "3"
      success: "2"
      error: "1"
      actor: "5"
    border:
      primary: "8"
      secondary: "8"
      faint: "8"
    icon:
      newcontributor: "6"
      contributor: "4"
      collaborator: "5"
      member: "3"
      owner: "11"
      unknownrole: "8"

pager:
  diff: ""
